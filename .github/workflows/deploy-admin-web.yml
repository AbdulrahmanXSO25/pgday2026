# §33.5 — deploy admin-web. Gated by the `production` GitHub Environment.
# API_BASE_URL is required at build time (next.config.ts rewrite target).
name: deploy-admin-web

on:
  push:
    branches: [master]
    paths:
      - "apps/admin-web/**"
      - "packages/ui/**"
      - "packages/validation/**"
      - "packages/types/**"

jobs:
  deploy-production:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@pgegypt/admin-web
      - name: OpenNext build
        working-directory: apps/admin-web
        env:
          API_BASE_URL: https://api.pgegypt.org
          NEXT_PUBLIC_SITE_URL: https://admin.pgegypt.org
        run: pnpm exec opennextjs-cloudflare build
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
        working-directory: apps/admin-web