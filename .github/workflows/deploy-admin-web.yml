# §33.5 — deploy admin-web to Cloudflare Pages (static export).
# Admin is a client-side SPA shell: all data via direct API calls with a
# bearer token (no server-side proxy, no cookies cross-origin).
name: deploy-admin-web

on:
  push:
    branches: [master]
    paths:
      - "apps/admin-web/**"
      - "packages/ui/**"
      - "packages/validation/**"
      - "packages/types/**"

jobs:
  deploy-production:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        working-directory: apps/admin-web
        env:
          NEXT_PUBLIC_API_BASE_URL: https://pgegypt-api.abdulrahmannader-123.workers.dev
          NEXT_PUBLIC_SITE_URL: https://pgegypt-admin-web.pages.dev
        run: pnpm exec next build
      - name: Deploy to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler pages deploy out --project-name=pgegypt-admin-web
        working-directory: apps/admin-web
      - name: Post-deploy smoke check
        run: node scripts/post-deploy-smoke.mjs pages https://pgegypt-admin-web.pages.dev