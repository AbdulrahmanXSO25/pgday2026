# §33.5 — deploy admin-web. Staging auto, production behind approval. No DB of its own.
name: deploy-admin-web

on:
  push:
    branches: [main]
    paths:
      - "apps/admin-web/**"
      - "packages/ui/**"
      - "packages/validation/**"
      - "packages/types/**"

jobs:
  deploy-staging:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@pgegypt/admin-web
      - name: OpenNext build
        working-directory: apps/admin-web
        run: pnpm exec opennextjs-cloudflare build
      - name: Deploy staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/admin-web
          command: deploy --env staging

  deploy-production:
    needs: deploy-staging
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@pgegypt/admin-web
      - name: OpenNext build
        working-directory: apps/admin-web
        run: pnpm exec opennextjs-cloudflare build
      - name: Deploy production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/admin-web
          command: deploy --env production
