# §33.4 — deploy public-web to Cloudflare Pages (static export).
# Two triggers, same job body:
# - push to master (code change) → rebuild using committed content/*.json
# - repository_dispatch (publish) → fetch latest snapshot from R2 first, then build+deploy
# NEXT_PUBLIC_* vars are inlined at build time — must be set here.
name: deploy-public-web

on:
  push:
    branches: [master]
    paths:
      - "apps/public-web/**"
      - "packages/ui/**"
      - "packages/validation/**"
  repository_dispatch:
    types: [publish]

concurrency:
  group: publish-${{ github.event.client_payload.slug || 'code-push' }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # On a publish trigger, overwrite committed content with the published snapshot from R2
      - name: Fetch content snapshot (publish trigger)
        if: github.event_name == 'repository_dispatch'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: pgegypt-media
          CONTENT_SNAPSHOT_ID: ${{ github.event.client_payload.snapshotId }}
        run: node scripts/fetch-content-snapshot.mjs
      - name: Build static export
        working-directory: apps/public-web
        env:
          NEXT_PUBLIC_SITE_URL: https://pgegypt-public-web.pages.dev
          NEXT_PUBLIC_API_BASE_URL: https://pgegypt-api.abdulrahmannader-123.workers.dev
        run: pnpm exec next build
      - name: noindex guard (§27.5)
        run: node scripts/assert-no-noindex.mjs apps/public-web/out
      - name: Deploy to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler pages deploy out --project-name=pgegypt-public-web
        working-directory: apps/public-web
      - name: Post-deploy smoke check
        run: node scripts/post-deploy-smoke.mjs pages https://pgegypt-public-web.pages.dev