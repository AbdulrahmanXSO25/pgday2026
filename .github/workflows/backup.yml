# §32.2 — daily backup of the D1 database to R2 (30-day lifecycle handles retention).
# Uses wrangler d1 export against remote, then uploads .sql to R2 via S3 API.
name: backup

on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 export pgegypt-db --remote --output backup.sql
        working-directory: apps/api
      - name: Upload to R2 (backups/<date>/)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          node scripts/upload-backup.mjs backup.sql "backups/pgegypt-2026/${DATE}/db.sql"