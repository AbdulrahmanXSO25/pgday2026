# Browser E2E in CI — axe accessibility (portal + admin) + cross-browser smoke.
# Requires: dev servers (started by playwright.config webServer) + seeded local SQLite.
name: e2e

on:
  pull_request:
  workflow_dispatch:

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Local infra used by media/email paths (best-effort; tests don't hard-require it).
      # Docker Hub anonymous pulls are rate-limited on shared runners — never fail the job.
      - name: Start MinIO + Maildev
        continue-on-error: true
        run: docker compose -f docker/docker-compose.yml up -d || true

      # Fresh local DB + seed + organizer accounts for login tests
      - name: Prepare local database
        run: |
          pnpm --filter @pgegypt/db exec pnpm migrate
          pnpm --filter @pgegypt/db exec pnpm seed
          pnpm --filter @pgegypt/db exec tsx scripts/bootstrap-ci.ts

      - name: Install browsers
        run: pnpm exec playwright install chromium firefox --with-deps

      - name: Run axe + cross-browser E2E
        run: pnpm exec playwright test --project=a11y --project=ui-e2e --project=cross-firefox

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
