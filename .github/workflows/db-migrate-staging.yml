# §33.1 — manual workflow_dispatch: apply pending migrations to the production D1 database.
# (Deploys also apply migrations automatically; this is for manual/emergency runs.)
name: db-migrate

on:
  workflow_dispatch:

jobs:
  migrate:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply pgegypt-db --remote
        working-directory: apps/api