# §33.3 — deploy api Worker. D1 migrations applied before deploy, gated by the
# `production` GitHub Environment (requires approval if configured).
name: deploy-api

on:
  push:
    branches: [master]
    paths:
      - "apps/api/**"
      - "packages/db/**"
      - "packages/auth/**"
      - "packages/mail/**"
      - "packages/queue/**"
      - "packages/storage/**"
      - "packages/publish/**"
      - "packages/validation/**"
      - "migrations/**"

jobs:
  deploy-production:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@pgegypt/api
      - name: Apply D1 migrations (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply pgegypt-db --remote
        working-directory: apps/api
      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
        working-directory: apps/api